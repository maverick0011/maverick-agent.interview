name: Maverick AI CI/CD & CloudNative Academy Deployment

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'ci-cd-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. Verification & Web Application Build
  # ========================================================
  verify-and-build:
    name: Lint & Build Web (interview.cloudnativeacademy.in)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Verify CNAME exists
        run: |
          if [ -f "dist/CNAME" ]; then
            echo "CNAME configured: $(cat dist/CNAME)"
          else
            echo "interview.cloudnativeacademy.in" > dist/CNAME
          fi

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ========================================================
  # 2. Automated GitHub Pages Deployment (On Main Branch Push/Merge)
  # ========================================================
  deploy-github-pages:
    name: Deploy to GitHub Pages (interview.cloudnativeacademy.in)
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ========================================================
  # 3. Cross-Platform Desktop Packaging (macOS & Windows)
  # ========================================================
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    needs: verify-and-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact-name: Maverick-AI-macOS-Universal
            build-script: npm run electron:build:mac
          - os: windows-latest
            platform: win
            artifact-name: Maverick-AI-Windows-x64
            build-script: npm run electron:build:win

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Web Bundle
        run: npm run build

      - name: Package Desktop Installer
        run: |
          npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Desktop Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: warn
